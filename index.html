<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176b5b">
  <meta name="description" content="Private, offline-first personal wealth manager">
  <title>My Wealth</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PRIVATE &amp; OFFLINE</p>
        <h1 id="page-title">Home</h1>
      </div>
      <button class="icon-button" id="quick-add-button" type="button" aria-label="Add new item">＋</button>
    </header>

    <main id="main-content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-route="home" type="button"><span>⌂</span>Home</button>
      <button class="nav-item" data-route="investments" type="button"><span>◒</span>Investments</button>
      <button class="nav-item" data-route="expenses" type="button"><span>↓</span>Expenses</button>
      <button class="nav-item" data-route="accounts" type="button"><span>▣</span>Accounts</button>
      <button class="nav-item" data-route="more" type="button"><span>•••</span>More</button>
    </nav>
  </div>

  <dialog id="app-dialog">
    <form id="dialog-form" method="dialog">
      <div class="dialog-header">
        <h2 id="dialog-title">Add item</h2>
        <button class="icon-button ghost" value="cancel" type="submit" formnovalidate aria-label="Close">×</button>
      </div>
      <div id="dialog-body"></div>
      <div class="dialog-actions">
        <button class="button secondary" value="cancel" type="submit" formnovalidate>Cancel</button>
        <button class="button primary" id="dialog-save" value="default" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="backup-file-input" type="file" accept="application/json,.json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
