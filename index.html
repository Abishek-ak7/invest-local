<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; connect-src 'self' https://api.twelvedata.com https://api.mfapi.in; font-src 'self'; form-action 'self'; frame-src 'none'; img-src 'self' data:; manifest-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'">
  <meta name="theme-color" content="#176b5b">
  <meta name="description" content="Private, offline-first personal wealth manager">
  <title>My Wealth</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PRIVATE &amp; OFFLINE</p>
        <h1 id="page-title">Home</h1>
      </div>
      <div class="topbar-actions">
        <button class="icon-button streak-button" id="monthly-streak-button" type="button" aria-label="Check monthly investment streak" title="Check monthly investment streak"><span aria-hidden="true">✓</span><small id="monthly-streak-count">0</small></button>
        <button class="icon-button theme-button" id="theme-toggle-button" type="button" aria-label="Switch to dark theme">🌙</button>
        <button class="icon-button" id="quick-add-button" type="button" aria-label="Open workbook editor">▦</button>
      </div>
    </header>

    <main id="main-content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-route="home" type="button"><span aria-hidden="true">🏠</span>Home</button>
      <button class="nav-item" data-route="investments" type="button"><span aria-hidden="true">📊</span>Investments</button>
      <button class="nav-item" data-route="expenses" type="button"><span aria-hidden="true">🧾</span>Expenses</button>
      <button class="nav-item" data-route="accounts" type="button"><span aria-hidden="true">🏦</span>Accounts</button>
      <button class="nav-item" data-route="more" type="button"><span aria-hidden="true">🧭</span>More</button>
    </nav>
  </div>

  <dialog id="app-dialog">
    <form id="dialog-form" method="dialog">
      <div class="dialog-header">
        <h2 id="dialog-title">Add item</h2>
        <button class="icon-button ghost" value="cancel" type="submit" formnovalidate aria-label="Close">×</button>
      </div>
      <div id="dialog-body"></div>
      <div class="dialog-actions">
        <button class="button secondary" value="cancel" type="submit" formnovalidate>Cancel</button>
        <button class="button primary" id="dialog-save" value="default" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="backup-file-input" type="file" accept="application/json,.json,.wealth" hidden>
  <input id="spreadsheet-file-input" type="file" accept="text/csv,.csv" hidden>
  <input id="full-workbook-file-input" type="file" accept="application/xml,text/xml,.xml" hidden>

  <script type="module" src="js/app.js?v=58"></script>
</body>
</html>
